note:
  - id: scienze-sperimentali
    testo: >-
      L’ambito delle Scienze sperimentali comprende più insegnamenti (Scienze della Terra,
      Biologia, Chimica, Fisica) ed è da considerarsi disciplina unica. L’obiettivo primario delle
      scienze sperimentali è quello di promuovere la padronanza del metodo scientifico, favorendo
      anche la consapevolezza ambientale degli studenti attraverso lo studio di temi che li
      collegano alla vita quotidiana e al mondo del lavoro. L’approccio alle Scienze sperimentali,
      pertanto, è basato su una didattica che collega i diversi insegnamenti attraverso un
      linguaggio comune e, sul piano metodologico, propone attività interdisciplinari. Tenendo
      conto delle specificità dei diversi indirizzi e delle diverse articolazioni, e degli
      eventuali insegnamenti di ambito scientifico presenti negli elementi di base del quadro
      orario, le istituzioni scolastiche programmeranno le attività in modo da privilegiare i
      contenuti e le aree scientifiche più coerenti con i profili di uscita.
